<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>月人力總表</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./dc-lite.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;font-family:'Noto Sans TC',system-ui,sans-serif}
.mb{--ink:#1B2420;--sub:#5C6660;--line:#E1E4DF;width:1440px;height:720px;box-sizing:border-box;padding:28px 30px;background:#F3F4F1;color:var(--ink);font-size:14px}
.mb *{box-sizing:border-box}
.top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.top h1{margin:0;font-size:24px}
.top p{margin:4px 0 0;color:var(--sub);font-size:13px}
.legend{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-block;font-size:12px;font-weight:500;padding:2px 10px;border-radius:99px}
.k-s{background:#DCE8FB;color:#1E4FA8}
.k-r{background:#FCE6C8;color:#8A4B00}
.k-v{background:#E7DDF8;color:#55309A}
.k-p{background:#FBF0B8;color:#6B5500}
.k-l{background:#E3E5E4;color:#4A514D}
.k-x{background:#F9D6D6;color:#A02323}
.k-c{background:#D5EEDD;color:#1F6B3C}
.k-n{background:#F0F1EF;color:#5F6661;outline:1px dashed #B9BFB8;outline-offset:-1px}
.k-off{background:transparent;color:#9AA19C}
.grid{display:grid;grid-template-columns:120px repeat(30,42px);gap:3px;background:#fff;padding:12px;border-radius:14px}
.hd{text-align:center;font-size:11px;color:var(--sub);line-height:1.2;padding:2px 0}
.hd b{display:block;font-size:13px;color:var(--ink)}
.hd.today{background:#1B6B50;border-radius:8px;color:#fff}
.hd.today b{color:#fff}
.hd.wk{color:#8A918C}
.nm{display:flex;flex-direction:column;justify-content:center;font-weight:700;font-size:13px;padding-left:4px}
.nm small{font-weight:400;color:var(--sub);font-size:11px}
.c{height:38px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.sm{height:30px;font-size:12px;font-weight:500;color:var(--sub);display:flex;align-items:center;justify-content:center;border-radius:6px}
.sm.warn{background:#F9D6D6;color:#A02323;font-weight:700}
.lab{font-size:12px;color:var(--sub);font-weight:700;display:flex;align-items:center;padding-left:4px}
.foot{margin-top:14px;display:flex;gap:16px}
.box{background:#fff;border-radius:14px;padding:12px 16px;font-size:13px;flex:1}
.box b{display:block;margin-bottom:4px}
</style>
</helmet>
<div class="mb">
<div class="top">
<div>
<h1>2026 年 11 月　人力總表</h1>
<p>範例資料。人員為縱軸、日期為橫軸；最下面兩列自動算出每天待排與衝突。</p>
</div>
<div class="legend">
<span class="chip k-s">S 施工</span><span class="chip k-r">R 維修</span><span class="chip k-v">V 場勘會議</span><span class="chip k-p">P 待排</span><span class="chip k-l">L 請假</span><span class="chip k-x">X 衝突</span><span class="chip k-c">C 已完成</span><span class="chip k-n">N 未叫工</span>
</div>
</div>

<div class="grid">
<div></div>
<sc-for list="{{ heads }}" as="h" hint-placeholder-count="30"><div class="hd {{ h.cls }}"><b>{{ h.d }}</b>{{ h.w }}</div></sc-for>
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="9">
<div class="nm">{{ r.n }}<small>{{ r.sub }}</small></div>
<sc-for list="{{ r.cells }}" as="c" hint-placeholder-count="30"><div class="c k-{{ c.cls }}" aria-label="{{ c.aria }}">{{ c.ch }}</div></sc-for>
</sc-for>
<div class="lab">待排人數</div>
<sc-for list="{{ pend }}" as="p" hint-placeholder-count="30"><div class="sm">{{ p.t }}</div></sc-for>
<div class="lab">衝突／不足</div>
<sc-for list="{{ warn }}" as="w" hint-placeholder-count="30"><div class="sm {{ w.cls }}">{{ w.t }}</div></sc-for>
</div>

<div class="foot">
<div class="box"><b>11/12（四）人力不足</b>阿鎮團隊 4 人，同日需支援 MOLEX 與杜邦。</div>
<div class="box"><b>11/11（三）待排最多</b>4 人待排，可排入廣明光電點位追加與杜邦未決事項。</div>
<div class="box"><b>已自動帶入</b>阿東 11/10 請假（來自請假表），不會被排班。</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const CLS = { S: 's', R: 'r', V: 'v', P: 'p', L: 'l', X: 'x', C: 'c', N: 'n', '-': 'off' };
    const WD = ['日', '一', '二', '三', '四', '五', '六'];
    const P = [
      ['冠璋', '老闆', ['-', 'CCCCC--', 'VVPVS--', 'SPPRS--', 'PPVPP--', 'P']],
      ['飛哥', '', ['-', 'CCCCC--', 'RRSPS--', 'SSSPS--', 'SSPSS--', 'S']],
      ['阿倫', '', ['-', 'CCCCC--', 'RPSSS--', 'SSSSS--', 'SPSSS--', 'S']],
      ['阿東', '', ['-', 'CCCCC--', 'RLPSS--', 'PSSSS--', 'SSPSS--', 'S']],
      ['阿杰', '', ['-', 'CCCCC--', 'VRPSS--', 'SPSPS--', 'PSSPS--', 'P']],
      ['阿盛', '助手', ['-', 'CCPCC--', 'PPPPS--', 'PSPSP--', 'PPPPP--', 'P']],
      ['阿澤', '點工', ['-', 'NNNNN--', 'NNNNN--', 'NNNNN--', 'NNNNN--', 'N']],
      ['阿鎮團隊', '4 人·外包', ['-', 'CCCCC--', 'SSSXS--', 'SSSSS--', 'SSSSS--', 'S']]
    ];
    const heads = [];
    for (let d = 1; d <= 30; d++) { const w = (d - 1) % 7; heads.push({ d, w: WD[w], cls: (d === 9 ? 'today' : '') + (w === 0 || w === 6 ? ' wk' : '') }); }
    const strs = P.map((p) => p[2].join(''));
    const rows = P.map((p, i) => ({
      n: p[0], sub: p[1],
      cells: strs[i].split('').map((ch, j) => ({ cls: CLS[ch], ch: ch === '-' ? '' : ch, aria: p[0] + ' 11/' + (j + 1) + ' ' + ch }))
    }));
    const pend = [], warn = [];
    for (let j = 0; j < 30; j++) {
      let pc = 0, xc = 0;
      strs.forEach((s) => { if (s[j] === 'P') pc++; if (s[j] === 'X') xc++; });
      pend.push({ t: j + 1 < 9 || pc === 0 ? '' : String(pc) });
      warn.push({ t: xc ? '!' : '', cls: xc ? 'warn' : '' });
    }
    return { heads, rows, pend, warn };
  }
}
</script>
</body>
</html>
