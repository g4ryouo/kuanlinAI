<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>專案總覽</title>
<style>
:root{--bg:#F3F4F1;--card:#fff;--ink:#1B2420;--sub:#5C6660;--line:#E1E4DF;--blue:#0168BF;--red:#C62828}
@media (prefers-color-scheme:dark){:root{--bg:#14181A;--card:#1E2427;--ink:#F1F3EF;--sub:#A9B1AB;--line:#2B3336;--red:#F2A0A0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:15px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 12px 8px;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
h1{margin:0;font-size:20px}
a.link{color:var(--blue);font-size:14px;text-decoration:none;padding:10px 4px}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{min-height:44px;padding:0 14px;border:0;background:var(--card);color:var(--ink);font-size:15px;cursor:pointer;font-family:inherit}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;cursor:pointer;font-family:inherit}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
main{padding:12px;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:0 0 12px}
.card h2{margin:0 0 6px;font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;background:#E3E5E4;color:#4A514D}
.st-survey{background:#E7DDF8;color:#55309A}.st-quote{background:#FBF0B8;color:#6B5500}.st-construction{background:#DCE8FB;color:#1E4FA8}
.st-improve{background:#FCE6C8;color:#8A4B00}.st-acceptance{background:#D5EEDD;color:#1F6B3C}.st-billing{background:#EBDDC9;color:#6B4A1E}
.stale{background:#FBF0B8;color:#6B5500}
@media (prefers-color-scheme:dark){.chip{background:#2B3336;color:#C9D0CB}.st-survey{background:#34264F;color:#D4C4F2}.st-quote{background:#4A4115;color:#F2E49B}.st-construction{background:#1C3355;color:#BBD3F7}.st-improve{background:#4A3115;color:#F6D1A0}.st-acceptance{background:#1D3F2A;color:#A9DDB9}.st-billing{background:#3A2E1C;color:#E3CDAA}.stale{background:#4A4115;color:#F2E49B}}
.row{display:flex;gap:8px;font-size:14px;color:var(--sub);margin-top:3px;flex-wrap:wrap}
.row b{color:var(--ink);font-weight:600}
.row .late{color:var(--red);font-weight:700}
.note{font-size:14px;margin-top:6px;white-space:pre-wrap;word-break:break-word}
.note small{color:var(--sub);display:block}
.edit{margin-top:10px;width:100%}
.msg{text-align:center;color:var(--sub);padding:48px 16px}.msg.err{color:var(--red)}
#shade{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:9}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;display:none;max-width:560px;margin:0 auto}
#sheet.open,#shade.open{display:block}
#sheet h2{margin:0 0 10px;font-size:18px}
.f{margin:0 0 12px}
.f label{display:block;font-size:14px;color:var(--sub);margin-bottom:4px}
.f input[type=text],.f input[type=date],.f select,.f textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:16px;padding:8px 10px;font-family:inherit}
.f textarea{min-height:88px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:10px;min-height:44px}
.chk input{width:22px;height:22px}
.err{color:var(--red);font-size:14px;min-height:1.4em;margin:0 0 8px}
.actions{display:flex;gap:8px}.actions .btn{flex:1}
.actions.more{margin-top:10px}
.btn.danger{color:var(--red);border-color:var(--red)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:90vw;display:none;z-index:20}
#toast.show{display:block}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>專案總覽</h1>
    <a class="link" href="/liff/board">看人力排班 ›</a>
  </div>
  <div class="ctl">
    <div class="seg" role="group" aria-label="篩選">
      <button id="fAll" aria-pressed="true">進行中</button>
      <button id="fSoon" aria-pressed="false">近期有排班</button>
      <button id="fStale" aria-pressed="false">久未更新</button>
      <button id="fDone" aria-pressed="false">已結案</button>
    </div>
    <button class="btn primary" id="add">新增案場</button>
  </div>
</header>
<main id="main"><p class="msg">載入中…</p></main>

<div id="shade"></div>
<div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
(function () {
  var STAGES = [['', '（未設定）'], ['survey', '場勘'], ['quote', '報價'], ['construction', '施工'], ['improve', '改善'], ['acceptance', '驗收'], ['billing', '請款']];
  var main = document.getElementById('main');
  var token = null, data = null, filter = 'all', lastFocus = null;

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function show(text, err) { main.replaceChildren(el('p', 'msg' + (err ? ' err' : ''), text)); }
  function md(d) { return Number(d.slice(5, 7)) + '/' + Number(d.slice(8, 10)); }
  function toast(msg) {
    var t = document.getElementById('toast'); t.textContent = msg; t.className = 'show';
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.className = ''; }, 3500);
  }
  function api(method, url, body) {
    return fetch(url, { method: method, headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined })
      .then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); });
  }

  function row(label, value, cls) {
    var r = el('div', 'row'); r.appendChild(document.createTextNode(label));
    r.appendChild(el('b', cls || null, value)); return r;
  }

  function render() {
    var list = data.sites.filter(function (s) {
      if (filter === 'done') return s.archived;
      if (s.archived) return false;
      return filter === 'all' || (filter === 'soon' && s.upcoming_people_days > 0) || (filter === 'stale' && s.stale);
    });
    var doneCount = data.sites.filter(function (s) { return s.archived; }).length;
    document.getElementById('fDone').textContent = '已結案' + (doneCount ? '（' + doneCount + '）' : '');
    var frag = document.createDocumentFragment();
    if (!list.length) frag.appendChild(el('p', 'msg', filter === 'all' ? '還沒有進行中的案場，按「新增案場」建立' : filter === 'done' ? '還沒有結案的案場' : '沒有符合的案場'));
    list.forEach(function (s) {
      var c = el('section', 'card');
      c.appendChild(el('h2', null, s.name));
      var chips = el('div', 'chips');
      if (s.stage_label) chips.appendChild(el('span', 'chip st-' + s.stage, s.stage_label));
      if (s.region) chips.appendChild(el('span', 'chip', s.region));
      if (s.stale) chips.appendChild(el('span', 'chip stale', '超過 ' + s.days_idle + ' 天沒更新'));
      if (s.archived) chips.appendChild(el('span', 'chip', '已結案'));
      if (!s.flexible) chips.appendChild(el('span', 'chip', '時程不可彈性'));
      c.appendChild(chips);
      if (s.start_date || s.end_date) c.appendChild(row('期間', (s.start_date ? md(s.start_date) : '？') + ' – ' + (s.end_date ? md(s.end_date) : '？')));
      if (s.lead_name) c.appendChild(row('主責', s.lead_name));
      if (s.headcount_need) c.appendChild(row('人力需求', s.headcount_need));
      if (s.deadline) {
        var d = s.days_to_deadline;
        var txt = md(s.deadline) + (d < 0 ? '（已逾期 ' + (-d) + ' 天）' : d === 0 ? '（今天）' : '（' + d + ' 天後）');
        c.appendChild(row('重要期限', txt, d <= 7 ? 'late' : null));
      }
      c.appendChild(row('未來兩週排班', s.upcoming_people_days + ' 人次'));
      if (s.pool_count) c.appendChild(row('待排工作', s.pool_count + ' 件'));
      if (s.risks) { var n1 = el('div', 'note'); n1.appendChild(el('small', null, '風險')); n1.appendChild(document.createTextNode(s.risks)); c.appendChild(n1); }
      if (s.open_issues) { var n2 = el('div', 'note'); n2.appendChild(el('small', null, '未解決事項')); n2.appendChild(document.createTextNode(s.open_issues)); c.appendChild(n2); }
      var b = el('button', 'btn edit', '編輯「' + s.name + '」');
      b.onclick = function () { lastFocus = b; openForm(s); };
      c.appendChild(b);
      frag.appendChild(c);
    });
    main.replaceChildren(frag);
  }

  function field(id, label, input) {
    var w = el('div', 'f'); var l = el('label', null, label); l.htmlFor = id; w.appendChild(l); w.appendChild(input); return w;
  }
  function input(id, type, value) { var i = document.createElement('input'); i.type = type; i.id = id; i.value = value || ''; return i; }

  function openForm(s) {
    var creating = !s;
    s = s || { name: '', region: '', stage: '', start_date: '', end_date: '', lead_person_id: '', headcount_need: '', deadline: '', flexible: true, risks: '', open_issues: '' };
    var sheet = document.getElementById('sheet');
    sheet.replaceChildren();
    var h = el('h2', null, creating ? '新增案場' : '編輯案場'); h.id = 'sheetTitle'; sheet.appendChild(h);

    var name = input('fName', 'text', s.name); name.maxLength = 40; sheet.appendChild(field('fName', '案場名稱', name));
    var region = input('fRegion', 'text', s.region); region.maxLength = 40; sheet.appendChild(field('fRegion', '地區', region));

    var stage = document.createElement('select'); stage.id = 'fStage';
    STAGES.forEach(function (o) { var op = el('option', null, o[1]); op.value = o[0]; if (o[0] === (s.stage || '')) op.selected = true; stage.appendChild(op); });
    sheet.appendChild(field('fStage', '階段', stage));

    var two = el('div', 'two');
    two.appendChild(field('fStart', '開始日期', input('fStart', 'date', s.start_date)));
    two.appendChild(field('fEnd', '結束日期', input('fEnd', 'date', s.end_date)));
    sheet.appendChild(two);

    var lead = document.createElement('select'); lead.id = 'fLead';
    var none = el('option', null, '（未設定）'); none.value = ''; lead.appendChild(none);
    data.people.forEach(function (p) { var op = el('option', null, p.name); op.value = p.id; if (p.id === s.lead_person_id) op.selected = true; lead.appendChild(op); });
    sheet.appendChild(field('fLead', '主責', lead));

    var hc = input('fHc', 'text', s.headcount_need); hc.maxLength = 60; sheet.appendChild(field('fHc', '人力需求（例如：2 人，資深 1 人）', hc));
    sheet.appendChild(field('fDeadline', '重要期限', input('fDeadline', 'date', s.deadline)));

    var chk = el('label', 'chk'); var cb = document.createElement('input'); cb.type = 'checkbox'; cb.id = 'fFlex'; cb.checked = !!s.flexible;
    chk.appendChild(cb); chk.appendChild(document.createTextNode('時程可以彈性調整')); sheet.appendChild(chk);

    var risks = document.createElement('textarea'); risks.id = 'fRisks'; risks.maxLength = 1000; risks.value = s.risks || '';
    sheet.appendChild(field('fRisks', '風險', risks));
    var issues = document.createElement('textarea'); issues.id = 'fIssues'; issues.maxLength = 1000; issues.value = s.open_issues || '';
    sheet.appendChild(field('fIssues', '未解決事項', issues));

    var err = el('p', 'err'); err.setAttribute('role', 'alert'); sheet.appendChild(err);
    var act = el('div', 'actions');
    var cancel = el('button', 'btn', '取消'); cancel.onclick = closeSheet;
    var save = el('button', 'btn primary', '儲存');
    save.onclick = function () {
      err.textContent = ''; save.disabled = true;
      var body = {
        id: creating ? undefined : s.id, name: name.value, region: region.value, stage: stage.value,
        start_date: document.getElementById('fStart').value, end_date: document.getElementById('fEnd').value,
        lead_person_id: lead.value, headcount_need: hc.value, deadline: document.getElementById('fDeadline').value,
        flexible: cb.checked, risks: risks.value, open_issues: issues.value
      };
      api('POST', '/api/liff/site-save', body).then(function (res) {
        if (res.status === 200) { closeSheet(true); toast('已儲存'); load(); }
        else { err.textContent = res.body.error || '儲存失敗'; save.disabled = false; }
      }).catch(function () { err.textContent = '連線失敗，請稍後再試'; save.disabled = false; });
    };
    act.appendChild(cancel); act.appendChild(save); sheet.appendChild(act);
    if (!creating) {
      var more = el('div', 'actions more');
      var toggle = el('button', 'btn', s.archived ? '重新開啟' : '結案');
      toggle.onclick = function () {
        var msg = s.archived ? '要重新開啟「' + s.name + '」嗎？' : '確定要結案「' + s.name + '」嗎？結案後會移到「已結案」，歷史排班與紀錄都會保留，隨時可以重新開啟。';
        if (!window.confirm(msg)) return;
        toggle.disabled = true;
        api('POST', '/api/liff/site-archive', { id: s.id, archived: !s.archived }).then(function (res) {
          if (res.status === 200) { closeSheet(true); toast(s.archived ? '已重新開啟' : '已結案'); load(); }
          else { err.textContent = res.body.error || '處理失敗'; toggle.disabled = false; }
        }).catch(function () { err.textContent = '連線失敗，請稍後再試'; toggle.disabled = false; });
      };
      more.appendChild(toggle);
      if (s.task_count === 0) {
        var del = el('button', 'btn danger', '刪除（沒有任何紀錄）');
        del.onclick = function () {
          if (!window.confirm('確定要刪除「' + s.name + '」嗎？這個案場沒有任何工作紀錄，刪除後無法復原。')) return;
          del.disabled = true;
          api('POST', '/api/liff/site-delete', { id: s.id }).then(function (res) {
            if (res.status === 200) { closeSheet(true); toast('已刪除'); load(); }
            else { err.textContent = res.body.error || '刪除失敗'; del.disabled = false; }
          }).catch(function () { err.textContent = '連線失敗，請稍後再試'; del.disabled = false; });
        };
        more.appendChild(del);
      }
      sheet.appendChild(more);
    }
    document.getElementById('shade').className = 'open';
    sheet.className = 'open';
    name.focus();
  }
  function closeSheet(skipFocus) {
    document.getElementById('sheet').className = '';
    document.getElementById('shade').className = '';
    if (skipFocus !== true && lastFocus) lastFocus.focus();
  }
  document.getElementById('shade').onclick = function () { closeSheet(); };
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

  function setFilter(f) {
    filter = f;
    [['fAll', 'all'], ['fSoon', 'soon'], ['fStale', 'stale'], ['fDone', 'done']].forEach(function (p) { document.getElementById(p[0]).setAttribute('aria-pressed', String(f === p[1])); });
    if (data) render();
  }
  document.getElementById('fAll').onclick = function () { setFilter('all'); };
  document.getElementById('fSoon').onclick = function () { setFilter('soon'); };
  document.getElementById('fStale').onclick = function () { setFilter('stale'); };
  document.getElementById('fDone').onclick = function () { setFilter('done'); };
  document.getElementById('add').onclick = function () { lastFocus = document.getElementById('add'); if (data) openForm(null); };

  function load() {
    if (!data) show('載入中…');
    api('GET', '/api/liff/sites').then(function (res) {
      if (res.status !== 200) return show(res.body.error || '讀取失敗', true);
      data = res.body; render();
    }).catch(function () { show('連線失敗，請稍後再試', true); });
  }

  fetch('/api/liff/config').then(function (r) { return r.json(); }).then(function (cfg) {
    if (!cfg.liffId) return show('尚未設定 LIFF_ID', true);
    return liff.init({ liffId: cfg.liffId }).then(function () {
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
      token = liff.getIDToken();
      if (!token) return show('取不到登入資訊，請從 LINE 重新開啟', true);
      load();
    });
  }).catch(function (e) { show('無法啟動：' + (e && e.message ? e.message : '請從 LINE 開啟'), true); });
})();
</script>
</body>
</html>
