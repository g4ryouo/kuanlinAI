<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>人力排班</title>
<style>
:root{--bg:#F3F4F1;--card:#fff;--ink:#1B2420;--sub:#5C6660;--line:#E1E4DF;--blue:#0168BF;--today:#1B6B50}
@media (prefers-color-scheme:dark){:root{--bg:#14181A;--card:#1E2427;--ink:#F1F3EF;--sub:#A9B1AB;--line:#2B3336;--today:#2C9B74}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:15px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 12px 8px;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
h1{margin:0;font-size:20px}
a.link{color:var(--blue);font-size:14px;text-decoration:none;padding:10px 4px}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{min-height:44px;padding:0 14px;border:0;background:var(--card);color:var(--ink);font-size:15px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.nav{display:inline-flex;gap:6px;align-items:center}
.nav button,.go{min-width:44px;min-height:44px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font-size:15px;cursor:pointer;padding:0 12px}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.label{font-weight:700;min-width:5.5em;text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px 0}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px}
.wrap{padding:10px 12px 32px;overflow-x:auto}
table{border-collapse:separate;border-spacing:3px;background:var(--card);border-radius:14px;padding:8px}
th{font-weight:400}
th.hd{text-align:center;font-size:11px;color:var(--sub);line-height:1.2;padding:3px 0;border-radius:8px}
th.hd b{display:block;font-size:13px;color:var(--ink)}
th.hd.today{background:var(--today);color:#fff}th.hd.today b{color:#fff}
th.hd.wk{color:#8A918C}
.banner{margin:10px 12px 0;padding:10px 14px;border-radius:12px;background:#FBF0B8;color:#6B5500;font-size:14px}
th.nm{position:sticky;left:0;z-index:2;background:var(--card);text-align:left;min-width:76px;padding:0 6px 0 2px;font-size:13px}
th.nm b{display:block;font-weight:700}th.nm small{color:var(--sub);font-size:11px}
td{padding:0;text-align:center}
.cell{display:block;width:100%;min-width:36px;height:40px;border:0;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.cell{position:relative}
.cell sup{font-size:9px;margin-left:1px}
.dian{display:inline-block;background:#C62828;color:#fff;font-weight:700;border-radius:4px;line-height:1.3}
.cell .dian{position:absolute;top:1px;right:1px;font-size:10px;padding:0 3px}
.chip.dian{font-size:12px;padding:1px 8px}
.blank{height:40px;border-radius:6px}
td.today .cell,td.today .blank{box-shadow:0 0 0 2px var(--today)}
.k-S{background:#DCE8FB;color:#1E4FA8}.k-R{background:#FCE6C8;color:#8A4B00}.k-V{background:#E7DDF8;color:#55309A}
.k-P{background:#FBF0B8;color:#6B5500}.k-L{background:#E3E5E4;color:#4A514D}.k-X{background:#F9D6D6;color:#A02323}
.k-C{background:#D5EEDD;color:#1F6B3C}.k-N{background:#F0F1EF;color:#5F6661;outline:1px dashed #B9BFB8;outline-offset:-1px}
@media (prefers-color-scheme:dark){
 .k-S{background:#1C3355;color:#BBD3F7}.k-R{background:#4A3115;color:#F6D1A0}.k-V{background:#34264F;color:#D4C4F2}
 .k-P{background:#4A4115;color:#F2E49B}.k-L{background:#2B3336;color:#C9D0CB}.k-X{background:#522222;color:#F5B5B5}
 .k-C{background:#1D3F2A;color:#A9DDB9}.k-N{background:#222A2D;color:#AAB3AD}}
th.sum{text-align:left;font-size:12px;color:var(--sub);padding-left:2px;position:sticky;left:0;background:var(--card)}
td.sm{font-size:12px;color:var(--sub);height:30px}
td.sm.warn{background:#F9D6D6;color:#A02323;font-weight:700;border-radius:6px}
@media (prefers-color-scheme:dark){td.sm.warn{background:#522222;color:#F5B5B5}}
.msg{text-align:center;color:var(--sub);padding:48px 16px}.msg.err{color:#A02323}
@media (prefers-color-scheme:dark){.msg.err{color:#F2A0A0}}
#shade{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:9}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-height:70vh;overflow:auto;display:none;max-width:560px;margin:0 auto}
#sheet.open,#shade.open{display:block}
#sheet h2{margin:0 0 4px;font-size:17px}
.item{border-top:1px solid var(--line);padding:10px 0}
.item:first-of-type{border-top:0}
.item .t{font-weight:700}
.item .d{color:var(--sub);font-size:14px}
.note{color:var(--sub);font-size:14px;margin:8px 0 0}
#close{margin-top:12px;width:100%;min-height:44px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;font-size:15px;cursor:pointer}
.tabs{display:flex;gap:6px;margin-top:8px}
.tabs button{flex:1;min-height:44px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font-size:15px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.panel{padding:12px 12px 32px;max-width:720px;margin:0 auto}
.hint{color:var(--sub);font-size:13px;margin:0 0 10px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:0 0 12px}
.pcard h3{margin:0 0 6px;font-size:17px}
.prow{display:flex;gap:8px;font-size:14px;color:var(--sub);margin-top:4px;flex-wrap:wrap}
.prow b{color:var(--ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pp{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:2px 12px;font-size:14px}
.pp.out{border-style:dashed;color:var(--sub)}
.warn{color:#A02323;font-size:14px;margin-top:6px}
@media (prefers-color-scheme:dark){.warn{color:#F2A0A0}}
.btnrow{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;cursor:pointer;font-family:inherit}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.sh{color:#A02323;font-weight:700}
@media (prefers-color-scheme:dark){.sh{color:#F2A0A0}}
.urgent{background:#F9D6D6;color:#A02323;margin-left:6px}
@media (prefers-color-scheme:dark){.urgent{background:#522222;color:#F5B5B5}}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:90vw;display:none;z-index:20}
#toast.show{display:block}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>人力排班</h1>
    <a class="link" href="/liff/today">看今日工作 ›</a>
  </div>
  <div class="tabs" role="tablist" aria-label="人力排班分頁">
    <button role="tab" id="tabBoard" aria-selected="true">人力表</button>
    <button role="tab" id="tabPool" aria-selected="false">待排池</button>
    <button role="tab" id="tabAvail" aria-selected="false">可用人力</button>
  </div>
  <div class="ctl" id="boardCtl">
    <div class="seg" role="group" aria-label="檢視範圍">
      <button id="vweek" aria-pressed="true">本週</button>
      <button id="vmonth" aria-pressed="false">整月</button>
    </div>
    <div class="nav">
      <button id="prev" aria-label="上一頁">‹</button>
      <span class="label" id="label" aria-live="polite"></span>
      <button id="next" aria-label="下一頁">›</button>
    </div>
    <button class="go" id="now" aria-label="回到目前這週或這個月">今天</button>
  </div>
</header>
<div class="legend" id="legend" aria-label="代號說明"></div>
<div id="banner" class="banner" hidden></div>
<div class="wrap" id="wrap"><p class="msg">載入中…</p></div>
<div class="panel" id="poolPanel" role="tabpanel" aria-labelledby="tabPool" hidden></div>
<div class="panel" id="availPanel" role="tabpanel" aria-labelledby="tabAvail" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<div id="shade"></div>
<div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
(function () {
  var LABEL = { S: '施工', R: '維修', V: '場勘／會議', P: '待排', L: '請假', X: '衝突', C: '已完成', N: '未叫工' };
  // 畫面上顯示的符號（資料與 API 仍用 S/R/V… 代號）；待排故意留空，只留黃底
  var SYMBOL = { S: '工', R: '修', V: '勘', P: '', L: '假', X: '❌', C: '✅', N: '未' };
  var wrap = document.getElementById('wrap');
  var token = null, view = window.innerWidth < 700 ? 'week' : 'month', anchor = null, data = null, lastFocus = null;

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function show(text, err) { wrap.replaceChildren(el('p', 'msg' + (err ? ' err' : ''), text)); }
  function md(date) { return Number(date.slice(5, 7)) + '/' + Number(date.slice(8, 10)); }
  function shift(date, days) { var d = new Date(date + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + days); return d.toISOString().slice(0, 10); }

  // legend
  var lg = document.getElementById('legend');
  Object.keys(LABEL).forEach(function (k) { lg.appendChild(el('span', 'chip k-' + k, k === 'P' ? '待排（黃底空白）' : SYMBOL[k] + ' ' + LABEL[k])); });
  lg.appendChild(el('span', 'chip dian', '點 假日出勤（點工）'));

  var tab = 'board', poolData = null;
  function toast(msg) {
    var t = document.getElementById('toast'); t.textContent = msg; t.className = 'show';
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.className = ''; }, 3500);
  }
  function post(url, body) {
    return fetch(url, { method: 'POST', headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); });
  }
  function showTab(name) {
    tab = name;
    ['Board', 'Pool', 'Avail'].forEach(function (n) {
      document.getElementById('tab' + n).setAttribute('aria-selected', String(name === n.toLowerCase()));
    });
    var isBoard = name === 'board';
    document.getElementById('boardCtl').hidden = !isBoard;
    document.getElementById('legend').hidden = !isBoard;
    document.getElementById('banner').hidden = true;
    document.getElementById('wrap').hidden = !isBoard;
    document.getElementById('poolPanel').hidden = name !== 'pool';
    document.getElementById('availPanel').hidden = name !== 'avail';
    if (!token) return;
    if (isBoard) load('');
    else loadPool();
  }
  function hh(t) { return t ? t.slice(0, 5) : null; }

  function renderPool(d) {
    var panel = document.getElementById('poolPanel');
    var frag = document.createDocumentFragment();
    frag.appendChild(el('p', 'hint', '已確認但還沒排人的工作。系統依規則建議人選，按「排入建議人選」才會寫入排班。'));
    if (!d.pool.length) frag.appendChild(el('p', 'msg', '目前沒有待排的工作'));
    d.pool.forEach(function (t) {
      var c = el('section', 'pcard');
      var h = el('h3', null, t.title);
      if (t.priority === 'high') h.appendChild(el('span', 'chip urgent', '急'));
      c.appendChild(h);
      var r1 = el('div', 'prow');
      r1.appendChild(document.createTextNode('日期要求'));
      r1.appendChild(el('b', null, t.wanted_date ? md(t.wanted_date) + '（' + t.weekday + '）' : '未定'));
      if (t.start_time) r1.appendChild(el('b', null, hh(t.start_time) + (t.end_time ? '–' + hh(t.end_time) : ' 起')));
      r1.appendChild(document.createTextNode('人力')); r1.appendChild(el('b', null, (t.headcount || 2) + ' 人'));
      if (t.suggestion.daily) r1.appendChild(el('span', 'chip dian', '點 假日出勤'));
      c.appendChild(r1);
      var s = t.suggestion;
      var r2 = el('div', 'prow'); r2.appendChild(document.createTextNode('建議人選')); c.appendChild(r2);
      if (s.names.length) {
        var chips = el('div', 'chips');
        s.names.forEach(function (n) { chips.appendChild(el('span', 'pp', n)); });
        c.appendChild(chips);
        c.appendChild(el('div', 'prow', s.reason));
      } else {
        c.appendChild(el('div', 'warn', s.reason));
      }
      s.warnings.forEach(function (w) { c.appendChild(el('div', 'warn', w)); });
      var row = el('div', 'btnrow');
      var go = el('button', 'btn primary', '排入建議人選');
      go.disabled = !s.names.length;
      go.onclick = function () {
        if (!window.confirm('確定把「' + t.title + '」排給 ' + s.names.join('、') + '？')) return;
        go.disabled = true;
        post('/api/liff/pool-assign', { task_id: t.id }).then(function (res) {
          if (res.status === 200) { toast('已排入：' + res.body.names.join('、')); poolData = null; loadPool(); }
          else { toast(res.body.error || '排入失敗'); go.disabled = false; loadPool(); }
        }).catch(function () { toast('連線失敗，請稍後再試'); go.disabled = false; });
      };
      var cancel = el('button', 'btn', '取消');
      cancel.onclick = function () {
        if (!window.confirm('確定要取消「' + t.title + '」嗎？取消後會從待排池移除。')) return;
        cancel.disabled = true;
        post('/api/liff/pool-cancel', { task_id: t.id }).then(function (res) {
          if (res.status === 200) { toast('已取消'); loadPool(); }
          else { toast(res.body.error || '取消失敗'); cancel.disabled = false; loadPool(); }
        }).catch(function () { toast('連線失敗，請稍後再試'); cancel.disabled = false; });
      };
      row.appendChild(go); row.appendChild(cancel); c.appendChild(row);
      frag.appendChild(c);
    });
    panel.replaceChildren(frag);
  }

  function renderAvail(d) {
    var panel = document.getElementById('availPanel');
    var frag = document.createDocumentFragment();
    frag.appendChild(el('p', 'hint', '今天起兩週：誰還沒排，以及待排工作造成的人力缺口。假日只在有待排需求時才列出，出勤會標註為「點」（點工）。'));
    if (d.calendarMissing) frag.appendChild(el('p', 'warn', '這段期間有年份還沒建立國定假日資料，目前只依週末判斷。'));
    d.available.forEach(function (day) {
      var c = el('section', 'pcard');
      var hd = el('h3', null, md(day.date) + '（' + day.weekday + '）' + (day.date === d.today ? '・今天' : ''));
      if (day.rest) hd.appendChild(el('span', 'chip dian', '點'));
      c.appendChild(hd);
      var r = el('div', 'prow'); r.appendChild(document.createTextNode('有空')); c.appendChild(r);
      if (day.free.length) {
        var ch = el('div', 'chips'); day.free.forEach(function (n) { ch.appendChild(el('span', 'pp', n)); }); c.appendChild(ch);
      } else c.appendChild(el('div', 'prow', '沒有人有空'));
      if (day.outsourced.length) {
        var r2 = el('div', 'prow'); r2.appendChild(document.createTextNode('外包（未叫工）')); c.appendChild(r2);
        var ch2 = el('div', 'chips'); day.outsourced.forEach(function (n) { ch2.appendChild(el('span', 'pp out', n)); }); c.appendChild(ch2);
      }
      if (day.demand > 0) {
        var r3 = el('div', 'prow'); r3.appendChild(document.createTextNode('待排需求')); r3.appendChild(el('b', null, day.demand + ' 人'));
        if (day.shortage > 0) r3.appendChild(el('span', 'sh', '缺 ' + day.shortage + ' 人'));
        c.appendChild(r3);
      }
      frag.appendChild(c);
    });
    if (!d.available.length) frag.appendChild(el('p', 'msg', '這兩週都是休息日'));
    panel.replaceChildren(frag);
  }

  function loadPool() {
    var target = document.getElementById(tab === 'pool' ? 'poolPanel' : 'availPanel');
    if (!poolData) target.replaceChildren(el('p', 'msg', '載入中…'));
    fetch('/api/liff/pool', { headers: { Authorization: 'Bearer ' + token } })
      .then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); })
      .then(function (res) {
        if (res.status !== 200) return target.replaceChildren(el('p', 'msg err', res.body.error || '讀取失敗'));
        poolData = res.body;
        if (tab === 'pool') renderPool(poolData); else if (tab === 'avail') renderAvail(poolData);
      })
      .catch(function () { target.replaceChildren(el('p', 'msg err', '連線失敗，請稍後再試')); });
  }
  document.getElementById('tabBoard').onclick = function () { showTab('board'); };
  document.getElementById('tabPool').onclick = function () { showTab('pool'); };
  document.getElementById('tabAvail').onclick = function () { showTab('avail'); };

  function setView(v) {
    view = v;
    document.getElementById('vweek').setAttribute('aria-pressed', String(v === 'week'));
    document.getElementById('vmonth').setAttribute('aria-pressed', String(v === 'month'));
  }

  function openSheet(row, day, cell) {
    var s = document.getElementById('sheet');
    s.replaceChildren();
    s.appendChild(el('h2', null, row.name + '・' + md(day.date) + '（' + day.weekday + '）')).id = 'sheetTitle';
    var chip = el('span', 'chip k-' + cell.code, (SYMBOL[cell.code] ? SYMBOL[cell.code] + ' ' : '') + (LABEL[cell.code] || ''));
    s.appendChild(chip);
    cell.items.forEach(function (it) {
      var box = el('div', 'item');
      var time = it.start ? (it.end ? it.start + '–' + it.end : it.start + ' 起') : '時間未定';
      box.appendChild(el('div', 't', it.title));
      box.appendChild(el('div', 'd', time + (it.vehicle ? '・' + it.vehicle : '')));
      if (it.daily) box.appendChild(el('span', 'chip dian', '點 假日出勤（點工）'));
      s.appendChild(box);
    });
    if (cell.note) s.appendChild(el('p', 'note', cell.note));
    var c = el('button', null, '關閉'); c.id = 'close'; c.onclick = closeSheet;
    s.appendChild(c);
    document.getElementById('shade').className = 'open';
    s.className = 'open';
    c.focus();
  }
  function closeSheet() {
    document.getElementById('sheet').className = '';
    document.getElementById('shade').className = '';
    if (lastFocus) lastFocus.focus();
  }
  document.getElementById('shade').onclick = closeSheet;
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

  function render(v) {
    data = v; anchor = v.from;
    document.getElementById('label').textContent = v.label;
    var bn = document.getElementById('banner');
    bn.hidden = !v.calendarMissing;
    if (v.calendarMissing) bn.textContent = '這段期間有年份還沒建立國定假日資料，目前只依週末判斷。';
    var table = el('table');
    table.setAttribute('aria-label', '人力表 ' + v.label);
    var thead = el('thead'), hr = el('tr');
    hr.appendChild(el('th'));
    v.days.forEach(function (d) {
      var th = el('th', 'hd' + (d.today ? ' today' : '') + (d.rest ? ' wk' : ''));
      if (d.holiday) { th.title = d.holiday; th.setAttribute('aria-label', md(d.date) + '（' + d.weekday + '）' + d.holiday); }
      th.scope = 'col';
      th.appendChild(el('b', null, view === 'week' ? md(d.date) : String(Number(d.date.slice(8, 10)))));
      th.appendChild(document.createTextNode(d.weekday));
      hr.appendChild(th);
    });
    thead.appendChild(hr); table.appendChild(thead);

    var tbody = el('tbody');
    v.rows.forEach(function (row) {
      var tr = el('tr');
      var nm = el('th', 'nm'); nm.scope = 'row';
      nm.appendChild(el('b', null, row.name));
      if (row.sub) nm.appendChild(el('small', null, row.sub));
      tr.appendChild(nm);
      row.cells.forEach(function (cell, i) {
        var day = v.days[i];
        var td = el('td', day.today ? 'today' : '');
        if (!cell.code || cell.code === '-') {
          td.appendChild(el('div', 'blank'));
        } else {
          var b = el('button', 'cell k-' + cell.code);
          b.textContent = SYMBOL[cell.code] || '';
          if (cell.items.length > 1) b.appendChild(el('sup', null, '+' + (cell.items.length - 1)));
          if (cell.daily) b.appendChild(el('span', 'dian', '點'));
          b.setAttribute('aria-label', row.name + ' ' + md(day.date) + '（' + day.weekday + '）' + (LABEL[cell.code] || '') + (cell.daily ? '，點工' : ''));
          b.onclick = function () { lastFocus = b; openSheet(row, day, cell); };
          td.appendChild(b);
        }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);

    var tfoot = el('tfoot');
    [['待排人數', 'pending', false], ['衝突', 'conflicts', true]].forEach(function (cfg) {
      var tr = el('tr'); var th = el('th', 'sum', cfg[0]); th.scope = 'row'; tr.appendChild(th);
      v.summary.forEach(function (s) {
        var n = s[cfg[1]];
        var td = el('td', 'sm' + (cfg[2] && n ? ' warn' : ''));
        td.textContent = n ? (cfg[2] ? '!' : String(n)) : '';
        if (cfg[2] && n) td.setAttribute('aria-label', md(s.date) + ' 有 ' + n + ' 筆衝突');
        tr.appendChild(td);
      });
      tfoot.appendChild(tr);
    });
    table.appendChild(tfoot);
    wrap.replaceChildren(table);
  }

  function load(date) {
    show('載入中…');
    fetch('/api/liff/board?view=' + view + '&date=' + encodeURIComponent(date || ''), { headers: { Authorization: 'Bearer ' + token } })
      .then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); })
      .then(function (res) { if (res.status !== 200) return show(res.body.error || '讀取失敗', true); render(res.body); })
      .catch(function () { show('連線失敗，請稍後再試', true); });
  }

  function step(dir) {
    if (!token || !data) return;
    load(view === 'week' ? shift(data.from, dir * 7) : (dir < 0 ? shift(data.from, -1) : shift(data.to, 1)));
  }
  document.getElementById('prev').onclick = function () { step(-1); };
  document.getElementById('next').onclick = function () { step(1); };
  document.getElementById('now').onclick = function () { if (token) load(''); };
  document.getElementById('vweek').onclick = function () { if (view !== 'week') { setView('week'); if (token) load(''); } };
  document.getElementById('vmonth').onclick = function () { if (view !== 'month') { setView('month'); if (token) load(''); } };
  setView(view);

  fetch('/api/liff/config').then(function (r) { return r.json(); }).then(function (cfg) {
    if (!cfg.liffId) return show('尚未設定 LIFF_ID', true);
    return liff.init({ liffId: cfg.liffId }).then(function () {
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
      token = liff.getIDToken();
      if (!token) return show('取不到登入資訊，請從 LINE 重新開啟', true);
      showTab(location.hash === '#pool' ? 'pool' : location.hash === '#avail' ? 'avail' : 'board');
    });
  }).catch(function (e) { show('無法啟動：' + (e && e.message ? e.message : '請從 LINE 開啟'), true); });
})();
</script>
</body>
</html>
